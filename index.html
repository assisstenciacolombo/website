<script>
function toggleAIChat() {
  document.getElementById('ai-chat-window').classList.toggle('hidden');
}

async function handleAISubmit(e) {
  e.preventDefault();
  const inputEl = document.getElementById('ai-input');
  const chatBody = document.getElementById('ai-chat-body');
  const btn = document.getElementById('ai-send-btn');
  const userText = inputEl.value.trim();

  if (!userText) return;

  chatBody.innerHTML += `
    <div class="bg-[#2997FF] text-white p-3.5 rounded-2xl max-w-[85%] ml-auto rounded-tr-none font-medium">
      ${userText}
    </div>
  `;
  inputEl.value = '';
  chatBody.scrollTop = chatBody.scrollHeight;

  const loadingId = 'loading-' + Date.now();
  chatBody.innerHTML += `
    <div id="${loadingId}" class="bg-zinc-800 text-[#86868B] p-3 rounded-2xl max-w-[85%] rounded-tl-none italic">
      I.A. está analisando...
    </div>
  `;
  chatBody.scrollTop = chatBody.scrollHeight;
  btn.disabled = true;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userText })
    });

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error.message || 'Erro no servidor');
    }

    let responseText = data.candidates[0].content.parts[0].text;

    document.getElementById(loadingId).remove();

    chatBody.innerHTML += `
      <div class="bg-zinc-800 text-white p-3.5 rounded-2xl max-w-[85%] rounded-tl-none border border-white/5 space-y-2">
        <p>${responseText.replace(/\n/g, '<br>')}</p>
        <a href="https://wa.me/5541984027119?text=${encodeURIComponent('Olá! Estava no site e quero confirmar o orçamento: ' + userText)}" 
           target="_blank" class="block text-center bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl mt-2 transition">
           <i class="fa-brands fa-whatsapp"></i> Finalizar no WhatsApp
        </a>
      </div>
    `;
  } catch (error) {
    console.error("Erro na requisição:", error);
    document.getElementById(loadingId).remove();
    chatBody.innerHTML += `
      <div class="bg-zinc-800 text-red-400 p-3 rounded-2xl max-w-[85%] rounded-tl-none">
        Ops, tive um problema ao conectar com a I.A. Tente novamente ou chame diretamente no WhatsApp (41) 98402-7119.
      </div>
    `;
  }

  btn.disabled = false;
  chatBody.scrollTop = chatBody.scrollHeight;
}
</script>
